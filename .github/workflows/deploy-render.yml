name: Deploy API to Render

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or full commit SHA to deploy
        required: true
        default: develop
        type: string
      clear_cache:
        description: Clear Render's build cache before deploying
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy existing Render service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Check required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          CPL_AUTH_JWT_SECRET: ${{ secrets.CPL_AUTH_JWT_SECRET }}
        run: |
          missing=0
          for name in RENDER_API_KEY RENDER_SERVICE_ID CPL_AUTH_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} is not set."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Configure API authentication settings
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          CPL_AUTH_JWT_SECRET: ${{ secrets.CPL_AUTH_JWT_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CPL_MEDIA_FOLDER: ${{ vars.CPL_MEDIA_FOLDER || 'cpl' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CPL_SMTP_HOST: ${{ secrets.CPL_SMTP_HOST }}
          CPL_SMTP_PORT: ${{ secrets.CPL_SMTP_PORT }}
          CPL_SMTP_USERNAME: ${{ secrets.CPL_SMTP_USERNAME }}
          CPL_SMTP_PASSWORD: ${{ secrets.CPL_SMTP_PASSWORD }}
          CPL_SMTP_FROM: ${{ secrets.CPL_SMTP_FROM }}
          CPL_SMTP_FROM_NAME: ${{ secrets.CPL_SMTP_FROM_NAME }}
          CPL_PUBLIC_WEB_URL: ${{ vars.CPL_PUBLIC_WEB_URL }}
          CPL_GEMINI_MODEL: ${{ vars.CPL_GEMINI_MODEL }}
          CPL_GROQ_MODEL: ${{ vars.CPL_GROQ_MODEL }}
          CPL_OPENROUTER_MODEL: ${{ vars.CPL_OPENROUTER_MODEL }}
        run: |
          set -euo pipefail
          set_env_var() {
            local key="$1"
            local value="$2"
            local payload
            local http_code
            payload="$(jq -n --arg value "${value}" '{value: $value}')"
            http_code="$(curl -sS -o /tmp/render-env-var.json -w "%{http_code}" -X PUT \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "${payload}")"
            if [ "${http_code}" != "200" ]; then
              cat /tmp/render-env-var.json
              echo "::error::Render rejected the ${key} update (HTTP ${http_code})."
              exit 1
            fi
          }
          set_env_var "CPL_AUTH_JWT_SECRET" "${CPL_AUTH_JWT_SECRET}"
          set_env_var "CPL_AUTH_TOKEN_EXPIRE_MINUTES" "60"
          set_env_var "CPL_MEDIA_FOLDER" "${CPL_MEDIA_FOLDER}"
          if [ -n "${CLOUDINARY_URL}" ]; then
            set_env_var "CPL_CLOUDINARY_URL" "${CLOUDINARY_URL}"
          else
            echo "::warning::Repository secret CLOUDINARY_URL is not set; picture uploads stay disabled on Render."
          fi
          assistant_keys=0
          for pair in GEMINI_API_KEY:CPL_GEMINI_API_KEY GROQ_API_KEY:CPL_GROQ_API_KEY OPENROUTER_API_KEY:CPL_OPENROUTER_API_KEY; do
            secret="${pair%%:*}"
            target="${pair##*:}"
            if [ -n "${!secret}" ]; then
              set_env_var "${target}" "${!secret}"
              assistant_keys=$((assistant_keys + 1))
            fi
          done
          for model in CPL_GEMINI_MODEL CPL_GROQ_MODEL CPL_OPENROUTER_MODEL; do
            if [ -n "${!model}" ]; then
              set_env_var "${model}" "${!model}"
            fi
          done
          if [ "${assistant_keys}" = "0" ]; then
            echo "::warning::No GEMINI_API_KEY, GROQ_API_KEY or OPENROUTER_API_KEY secret is set; the Striker assistant keeps any key already on Render."
          fi
          mail_keys=0
          for pair in CPL_SMTP_HOST:CPL_SMTP_HOST CPL_SMTP_PORT:CPL_SMTP_PORT CPL_SMTP_USERNAME:CPL_SMTP_USERNAME CPL_SMTP_PASSWORD:CPL_SMTP_PASSWORD CPL_SMTP_FROM:CPL_SMTP_FROM CPL_SMTP_FROM_NAME:CPL_SMTP_FROM_NAME CPL_PUBLIC_WEB_URL:CPL_PUBLIC_WEB_URL; do
            secret="${pair%%:*}"
            target="${pair##*:}"
            if [ -n "${!secret}" ]; then
              set_env_var "${target}" "${!secret}"
              mail_keys=$((mail_keys + 1))
            fi
          done
          if [ "${mail_keys}" = "0" ]; then
            echo "::warning::No SMTP secrets are set. Admin mail keeps whatever sender is already configured on Render."
          fi

      - name: Ask Render to deploy this commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          CLEAR_CACHE: ${{ inputs.clear_cache }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "${CLEAR_CACHE}" = "true" ]; then
            cache="clear"
          else
            cache="do_not_clear"
          fi
          echo "Deploying ${sha}"
          response="$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${sha}\",\"clearCache\":\"${cache}\"}")"
          http_code="$(printf '%s\n' "${response}" | tail -n 1)"
          body="$(printf '%s\n' "${response}" | sed '$d')"
          printf '%s\n' "${body}"
          if [ "${http_code}" != "201" ] && [ "${http_code}" != "202" ]; then
            echo "::error::Render rejected the deploy (HTTP ${http_code})."
            exit 1
          fi
          deploy_id="$(printf '%s\n' "${body}" | jq -r '.id // .deploy.id // empty')"
          if [ -z "${deploy_id}" ]; then
            echo "::error::Render did not return a deploy id."
            exit 1
          fi
          echo "DEPLOY_ID=${deploy_id}" >> "${GITHUB_ENV}"

      - name: Wait until that deploy is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ env.DEPLOY_ID }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            body="$(curl -sS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            status="$(printf '%s\n' "${body}" | jq -r '.status // .deploy.status // empty')"
            echo "Status: ${status}"
            case "${status}" in
              live)
                echo "Render deploy is live."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy ended with status ${status}."
                printf '%s\n' "${body}"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the Render deploy."
          exit 1
